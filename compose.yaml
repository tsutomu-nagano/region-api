services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://region:region@db:5432/region
      CORS_ALLOW_ORIGINS: http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5174:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - api

  refresh:
    build: .
    command: ["python", "seed.py", "--force"]
    environment:
      DATABASE_URL: postgresql+psycopg://region:region@db:5432/region
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - tools

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: region
      POSTGRES_USER: region
      POSTGRES_PASSWORD: region
    ports:
      - "5432:5432"
    volumes:
      - region-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U region -d region"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  region-postgres-data:
